  <text x="200" y="130" font-family="monospace" font-size="12" fill="#8C9BB3">DRUG</text>
  <text x="500" y="130" font-family="monospace" font-size="12" fill="#8C9BB3">IN</text>
  <text x="600" y="130" font-family="monospace" font-size="12" fill="#8C9BB3">OUT</text>
